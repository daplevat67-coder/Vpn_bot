version: "3.8"

services:
  bot:
    build: .
    container_name: telegram-bot-builder
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./media:/app/media
      - ./backups:/app/backups
      - ./bot/logs:/app/bot/logs
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: bot-builder-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
